name: Fedecredito diagnostics

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - .github/workflows/fedecredito-diagnostics.yml
      - apps/api/src/diagnose-fedecredito.mjs

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @promocards/api exec playwright install --with-deps chromium
      - run: node apps/api/src/diagnose-fedecredito.mjs
