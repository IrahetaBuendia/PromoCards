name: Scrapers

on:
  # 7am, 12pm y 6pm hora El Salvador (UTC-6) → 13:00, 18:00, 00:00 UTC
  schedule:
    - cron: "0 0,13,18 * * *"

  # Permite dispararlo manualmente desde el panel admin o desde GitHub UI
  workflow_dispatch:
    inputs:
      bank_id:
        description: "Banco específico a scrapear (dejar vacío para todos)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  select-banks:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      banks: ${{ steps.select.outputs.banks }}
    steps:
      - id: select
        env:
          BANK_ID: ${{ inputs.bank_id }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const banks = ['fedecredito', 'banco-industrial', 'credicomer', 'bac-credomatic', 'credisiman', 'banco-agricola', 'banco-cuscatlan'];
          const requested = process.env.BANK_ID || '';
          if (requested && !banks.includes(requested)) {
            throw new Error(`Banco no soportado: ${requested}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `banks=${JSON.stringify(requested ? [requested] : banks)}\n`);
          NODE

  scrape:
    name: Scraper ${{ matrix.bank }}
    needs: select-banks
    strategy:
      fail-fast: false
      matrix:
        bank: ${{ fromJSON(needs.select-banks.outputs.banks) }}
    runs-on: ${{ matrix.bank == 'fedecredito' && fromJSON('["promocards-fedecredito"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    concurrency:
      group: scraper-${{ matrix.bank }}
      cancel-in-progress: false
    defaults:
      run:
        shell: ${{ matrix.bank == 'fedecredito' && 'powershell' || 'bash' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium (Playwright)
        run: pnpm --filter @promocards/api exec playwright install --with-deps chromium

      - name: Correr scrapers
        run: pnpm --filter @promocards/api exec tsx src/scrape.ts
        env:
          BANK_ID: ${{ matrix.bank }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
